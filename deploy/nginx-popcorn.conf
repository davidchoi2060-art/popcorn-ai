# 팝콘PC AI — 개발/스테이징 서버 nginx (2026-07-30 현행)
#
# 설치: /etc/nginx/sites-available/popcorn 로 복사 → nginx -t → systemctl reload nginx
#
# **이 파일은 서버에서 실제 돌고 있는 설정을 정본으로 옮긴 것이다(슬라이스 99).**
# 그전까지 리포에는 `server_name _;` + HTTP만 있는 낡은 설정이 있었고, 서버에는
# certbot이 고친 HTTPS 설정이 돌고 있었다 — 리포가 거짓을 말하는 상태였다.
# 누군가 리포 설정을 그대로 복사하면 돌아가는 HTTPS를 덮어썼을 것이다.
#
# ── 접근 정책 (사용자 결정 2026-07-30) ─────────────────────────────
# 예전에는 Basic Auth가 사이트 전체를 봉쇄했다. 그런데 certbot 적용 과정에서
# `auth_basic` 지시어가 사라져 사이트가 공개된 상태로 이틀을 보냈다.
#
# 복구 대신 **경로별로 나누는** 쪽을 택했다(사용자 결정):
#   관리자  열어 둔다  — 슬라이스 70의 비밀번호 인증 + /api/admin/* 미들웨어 게이트가 막는다
#   고객    막는다     — 고객 인증이 아직 dev 어댑터라(`"@" in email`이 전부)
#                        누구나 남의 이메일로 로그인해 그 사람 주문·결제를 볼 수 있다
#
# **고객 경로를 다시 열려면 실 OAuth가 먼저다.** 그때 이 블록들을 걷는다.
# 확인: 관리자 화면·shared 스크립트가 고객 API를 부르는 곳은 0곳이다(실측).
#       고객 API를 쓰는 것은 `shared/auth.js` 하나이고 고객 화면 11개만 로드한다.

server {
    server_name admin.popcornai.co.kr;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 32m;      # 단가표 엑셀 업로드 여유
    access_log /var/log/nginx/popcorn.access.log;
    error_log  /var/log/nginx/popcorn.error.log;

    # ── 고객 영역 차단 ────────────────────────────────────────────
    # 404를 쓴다(403이 아니라) — 아직 열지 않은 것의 존재를 알리지 않는다.
    # `^~`로 접두어 우선 매칭: 정규식 location보다 먼저 걸린다.
    #
    # **주의: /api/auth/ 와 /api/admin/auth/ 는 다른 경로다.**
    # nginx 접두어 매칭은 URI 시작부터 보므로 /api/admin/auth/login은 여기 걸리지 않는다.
    # 관리자 로그인이 죽으면 아무도 들어올 수 없다 — 이 구분이 이 파일의 핵심이다.
    location ^~ /mvp1/            { return 404; }   # 고객 화면 13개
    location ^~ /api/auth/        { return 404; }   # 고객 로그인·로그아웃·me
    location ^~ /api/my/          { return 404; }   # 고객 주문·결제·환불·후기
    location ^~ /api/candidates   { return 404; }   # 후보 카운터(S1)
    location ^~ /api/recommend    { return 404; }   # 견적 산출(S2)
    location ^~ /api/swap/        { return 404; }   # 부품 교체(S3)
    location ^~ /api/orders       { return 404; }   # 주문 생성(S4)
    location ^~ /api/ops          { return 404; }   # 고객용 운영 모드 조회
    location ^~ /api/showcase     { return 404; }   # 랜딩 대표 구성
    location ^~ /api/promo-click  { return 404; }   # 근거 클릭 수집

    # ── 앱 프록시 ─────────────────────────────────────────────────
    # API와 관리자 화면 모두 FastAPI가 서빙한다(mockups를 / 에 마운트).
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # 견적 응답이 2초대, 적재·집계는 더 걸릴 수 있다
    }

    # 헬스체크는 감시 도구가 붙을 수 있게 열어 둔다(민감 정보 없음)
    location = /api/health {
        proxy_pass       http://127.0.0.1:8000/api/health;
        access_log       off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.popcornai.co.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.popcornai.co.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── 80: ACME 통로만 남기고 HTTPS로 ──────────────────────────────────
server {
    listen 80 default_server;
    server_name admin.popcornai.co.kr;

    # 갱신도 이 경로를 쓴다 — 막히면 90일 뒤 조용히 만료된다.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://admin.popcornai.co.kr$request_uri; }
}
