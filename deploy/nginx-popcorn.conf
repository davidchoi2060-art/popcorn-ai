# 팝콘PC AI — 개발/스테이징 서버 nginx (2026-08-21 현행)
#
# 설치: /etc/nginx/sites-available/popcorn 로 복사 → nginx -t → systemctl reload nginx
#
# **이 파일은 서버에서 실제 돌고 있는 설정을 정본으로 옮긴 것이다(슬라이스 99).**
# 그전까지 리포에는 `server_name _;` + HTTP만 있는 낡은 설정이 있었고, 서버에는
# certbot이 고친 HTTPS 설정이 돌고 있었다 — 리포가 거짓을 말하는 상태였다.
# 누군가 리포 설정을 그대로 복사하면 돌아가는 HTTPS를 덮어썼을 것이다.
#
# ── 접근 정책 (2026-08-09 개정 · 사용자 결정) ──────────────────────
# 예전에는 Basic Auth가 사이트 전체를 봉쇄했다. 그런데 certbot 적용 과정에서
# `auth_basic` 지시어가 사라져 사이트가 공개된 상태로 이틀을 보냈다.
# 복구 대신 **경로별로 나누는** 쪽을 택했고(2026-07-30), 고객 경로를 404로 막았다.
#
# **2026-08-09: 고객 경로를 전부 열었다(사용자 결정).**
# 베타 테스터가 실제로 들어와 AI 상담 → 견적 → 구매까지 해보게 하는 것이
# 지금 단계의 목적이기 때문이다.
#
# ■ 열면서 감수한 것 — 다음 사람이 반드시 알아야 한다
#   고객 인증은 **아직 dev 어댑터다.** `api/customer_auth.py`의 검증은
#   `if "@" not in email` 한 줄이 전부이고 비밀번호도 OAuth도 인증 메일도 없다.
#   즉 **아무나 남의 이메일을 입력해 그 사람 세션을 받고**, `/api/my/` 로
#   그 사람의 주문·결제·환불·후기를 볼 수 있다.
#   개방 시점의 실회원은 6명이고 전부 우리 테스트 계정이었다.
#
#   **테스터에게 실제 개인정보를 넣지 말라고 공지해야 한다.**
#   실 OAuth(카카오·네이버·구글)가 이 구멍의 유일한 해소다 —
#   붙일 자리는 `api/admin_profile.PROVIDER_KO` + `_verify_google()` 로 좁혀져 있다.
#
# 관리자는 계속 열려 있고, 슬라이스 70의 비밀번호 인증 +
# `/api/admin/*` 미들웨어 게이트가 막는다(이건 그대로다).
#
# ── 도메인 분리 (2026-08-21 사장님 확정) ──────────────────────────
# 예전엔 admin.· www.· apex 세 이름이 **같은 server 블록**으로 들어와, www 에서도
# `/admin2/`를 주소로 직접 치면 관리자 화면이 열렸다(버튼은 없지만 문은 열려 있었다 —
# 랜딩 마크업에 admin 링크 0건, 허브 FAB 은 내부자 전용 판정이라 실패 시 숨김이었을 뿐).
#
# 그래서 443 블록을 **둘로 나눈다**:
#   ㉠ admin.popcornai.co.kr   관리자만. `/` 는 관리자 대시보드(`/admin2/`)로 리다이렉트.
#   ㉡ www. / apex             고객만. 관리자 경로(`/admin2/` `/admin/` `/api/admin/`)를
#                              404로 차단(안 나눈 옛 고객 경로 404 관례와 동일 — 존재를
#                              알리지 않는다). `/` 는 그대로 둔다 — 앱의 `/` 라우트
#                              (`api/main.py: _root_to_customer_landing`)가 이미
#                              고객 랜딩으로 307 한다.
#
# 인증서(SAN에 세 도메인 포함, `/etc/letsencrypt/live/admin.popcornai.co.kr/`)와
# 80 포트 리다이렉트 블록은 그대로 **공유**한다 — 나누지 않는다(ACME 갱신 경로가
# 막히면 90일 뒤 인증서가 조용히 만료된다). 공통 헤더·프록시 설정은 두 443 블록에
# **중복**된다 — 의도된 것이다. `include`로 빼면 배포 절차(단일 파일 복사)가 깨진다.

server {
    # 관리자 전용. `/`는 아래에서 관리자 대시보드로 가로챈다(그대로 두면 앱의 `/`가
    # 호스트를 안 가리고 고객 랜딩으로 307 해버린다 — `api/main.py` 참조).
    server_name admin.popcornai.co.kr;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 32m;      # 단가표 엑셀 업로드 여유
    access_log /var/log/nginx/popcorn.access.log;
    error_log  /var/log/nginx/popcorn.error.log;

    # ── 관리자 홈: `/` → 관리자 대시보드 (2026-08-21) ────────────────
    # 미로그인이면 `/admin2/`가 401 + 1초 뒤 `/admin2/login`으로 넘기는 HTML을 그대로
    # 돌려준다(`api/admin_ui_common.py: login_required_html()`, meta refresh — 실측
    # 확인함, 아래 참조). 그래서 여기서는 세션 유무를 가리지 않고 **항상**
    # `/admin2/`로 보낸다 — 로그인 여부 판단은 앱(미들웨어)의 몫으로 남긴다.
    # 302(임시)를 쓴다 — 301은 브라우저가 영구 캐시해 같은 사고(슬라이스 71: 옛
    # 로그인 화면이 캐시돼 재로그인이 막힘)를 반복할 수 있다(앱 자신의 `/` 리다이렉트가
    # 같은 이유로 307을 쓰는 것과 같은 논리). 이 위치에서 새 `add_header`를 선언하면
    # nginx 상속 규칙상 서버 블록의 보안 헤더 3종이 **이 자리에서만** 빠질 수 있어
    # (add_header는 현재 레벨에 하나라도 있으면 상위 레벨 것을 이어받지 않는다),
    # 넷을 함께 다시 적어 누락을 막는다.
    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 302 /admin2/;
    }

    # ── 앱 프록시 — 나머지는 지금 그대로(사장님 지시) ───────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # 견적 응답이 2초대, 적재·집계는 더 걸릴 수 있다
    }

    # 헬스체크는 감시 도구가 붙을 수 있게 열어 둔다(민감 정보 없음)
    location = /api/health {
        proxy_pass       http://127.0.0.1:8000/api/health;
        access_log       off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.popcornai.co.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.popcornai.co.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # 고객 전용. 관리자 화면은 아래에서 전부 404로 차단한다.
    server_name www.popcornai.co.kr popcornai.co.kr;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 32m;      # 단가표 엑셀 업로드 여유
    access_log /var/log/nginx/popcorn.access.log;
    error_log  /var/log/nginx/popcorn.error.log;

    # ── 관리자 화면 차단 (2026-08-21 사장님 확정) ─────────────────────
    # 고객 도메인에서는 관리자가 안 보인다. **반드시 `location /` 앞에 둔다**
    # (`^~` 는 접두어 우선 매칭 — 바로 아래 「고객 영역」 주석 블록과 같은 관례).
    # 404를 쓴다(403이 아니라) — 존재를 알리지 않기 위해서다.
    #
    # 슬래시 없는 형태(`/admin2`·`/admin`)도 실제 라우트라 따로 막는다 — `^~ /admin2/`는
    # 문자열 `/admin2`(슬래시 없음)를 잡지 못한다. 막지 않으면 그 경로는 앱까지 가서
    # "로그인이 필요합니다" 401 안내(1초 뒤 `/admin2/login`으로 이동하는 HTML)를 먼저
    # 보여준 뒤에야 `/admin2/login`이 이 규칙에 걸려 404가 된다 — 관리자 화면의 존재를
    # 잠깐 노출한다. `/admin`도 같은 이유 — 지금 그 경로는 앱이 410과 함께
    # "admin2로 이동" 링크가 박힌 안내를 그대로 돌려준다(오히려 401 HTML보다 더 많이
    # 노출한다). `/api/admin`(슬래시 없음)은 앱이 이미 자연히 404를 주지만, nginx
    # 층에서 명시적으로 막아 앱의 우연한 동작에 기대지 않는다.
    #
    # `/api/admin/`을 막으면 고객 랜딩의 허브 FAB 판정(`mockups/shared/hub-fab.js`)이
    # 평소의 200(`authenticated:false`) 대신 404를 받는다 — 그 파일의
    # `r.ok ? r.json() : null` 분기가 401·404 등 모든 비2xx를 **같은 값**(null)으로
    # 접어 숨김을 유지한다. fetch는 HTTP 오류 상태로는 reject하지 않으므로 `.catch()`도
    # 타지 않는다 — 콘솔에 아무것도 남기지 않는다(코드로 확인함, 2026-08-21).
    location = /admin2      { return 404; }
    location ^~ /admin2/    { return 404; }
    location = /admin       { return 404; }
    location ^~ /admin/     { return 404; }
    location = /api/admin   { return 404; }
    location ^~ /api/admin/ { return 404; }

    # ── 고객 영역: 열려 있다 (2026-08-09) ─────────────────────────
    # 2026-07-30 ~ 2026-08-09 사이에는 아래 10개 경로를 404로 막고 있었다.
    # 사용자 결정으로 전부 걷었다(위 「접근 정책」의 감수 사항을 먼저 읽어라).
    #
    # 되돌리려면 이 자리에 다시 넣는다 — **반드시 `location /` 앞에** 둔다.
    # `^~` 는 접두어 우선 매칭이라 정규식 location 보다 먼저 걸린다.
    # 404를 쓴다(403이 아니라) — 아직 열지 않은 것의 존재를 알리지 않기 위해서다.
    #
    #   location ^~ /mvp1/            { return 404; }   # 고객 화면 13개
    #   location ^~ /api/auth/        { return 404; }   # 고객 로그인·로그아웃·me
    #   location ^~ /api/my/          { return 404; }   # 고객 주문·결제·환불·후기
    #   location ^~ /api/candidates   { return 404; }   # 후보 카운터(S1)
    #   location ^~ /api/recommend    { return 404; }   # 견적 산출(S2)
    #   location ^~ /api/swap/        { return 404; }   # 부품 교체(S3)
    #   location ^~ /api/orders       { return 404; }   # 주문 생성(S4)
    #   location ^~ /api/ops          { return 404; }   # 고객용 운영 모드 조회
    #   location ^~ /api/showcase     { return 404; }   # 랜딩 대표 구성
    #   location ^~ /api/promo-click  { return 404; }   # 근거 클릭 수집
    #
    # **다시 막을 때 주의: /api/auth/ 와 /api/admin/auth/ 는 다른 경로다.**
    # nginx 접두어 매칭은 URI 시작부터 보므로 /api/admin/auth/login 은 위에 걸리지
    # 않는다. 잘못 막아 관리자 로그인까지 죽이면 아무도 들어올 수 없다.

    # ── 앱 프록시 ─────────────────────────────────────────────────
    # API와 고객 화면 모두 FastAPI가 서빙한다(mockups를 / 에 마운트). `/`는 손대지
    # 않는다 — 앱의 `/` 라우트가 이미 고객 랜딩(`/mvp1/main-landing.html`)으로 307 한다.
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # 견적 응답이 2초대, 적재·집계는 더 걸릴 수 있다
    }

    # 헬스체크는 감시 도구가 붙을 수 있게 열어 둔다(민감 정보 없음)
    location = /api/health {
        proxy_pass       http://127.0.0.1:8000/api/health;
        access_log       off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.popcornai.co.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.popcornai.co.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── 80: ACME 통로만 남기고 HTTPS로 ──────────────────────────────────
server {
    listen 80 default_server;
    server_name admin.popcornai.co.kr www.popcornai.co.kr popcornai.co.kr;

    # 갱신도 이 경로를 쓴다 — 막히면 90일 뒤 조용히 만료된다.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # $host = 요청의 Host 헤더(포트 제외, 없으면 매칭된 server_name 으로 대체) — 2026-08-21.
    # 고정 도메인(admin.popcornai.co.kr)으로 박아두면 www.로 들어온 사람이 admin.으로 튕긴다.
    location / { return 301 https://$host$request_uri; }
}
