# 팝콘PC AI — 내부 직원 베타 (GCP VM · 외부 IP 직접 접속 · HTTP)
#
# 설치: /etc/nginx/sites-available/popcorn 로 복사 → sites-enabled 심볼릭 링크
#       → nginx -t → systemctl reload nginx
#
# **이 파일의 핵심은 Basic Auth다.** 지금 로그인은 dev 어댑터(입력 이메일을 신원으로 신뢰)이므로
# 앱이 그대로 외부에 노출되면 누구나 승인된 관리자 이메일을 입력해 들어올 수 있다.
# 사용자 결정(2026-07-26): **nginx Basic Auth로 사이트 전체를 봉쇄**한다 — 외부인은 앱에
# 닿지도 못한다. 실 OAuth 연동이 끝나면 이 빗장을 걷어낼 수 있다.
#
# HTTP인 이유(정직 표기): 도메인이 없어 정식 인증서를 받을 수 없다. 같은 망을 쓰는 상대는
# Basic Auth 비밀번호와 세션 쿠키를 가로챌 수 있다 — 도메인 확보 후 아래 HTTPS 블록으로
# 전환하고 COOKIE_SECURE=1을 켠다.

server {
    listen 80 default_server;
    server_name _;

    # ── 접근 봉쇄 ──────────────────────────────────────────────
    auth_basic           "팝콘PC AI 내부 베타 - 직원 전용";
    auth_basic_user_file /etc/nginx/.htpasswd-popcorn;   # htpasswd로 생성(README 참조)

    # 서버 정보 노출 최소화
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 32m;      # 단가표 엑셀 업로드 여유
    access_log /var/log/nginx/popcorn.access.log;
    error_log  /var/log/nginx/popcorn.error.log;

    # ── 앱 프록시 ──────────────────────────────────────────────
    # API와 정적 목업 모두 FastAPI가 서빙한다(mockups를 / 에 마운트) — 경로 규칙이
    # 한 곳에만 있게 두는 편이 안전하다. 정적 분리는 성능이 문제가 될 때 검토.
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # 견적 응답이 2초대, 적재·집계는 더 걸릴 수 있다
    }

    # 헬스체크는 Basic Auth 없이 — 감시 도구가 붙을 수 있게(민감 정보 없음)
    location = /api/health {
        auth_basic off;
        proxy_pass       http://127.0.0.1:8000/api/health;
        access_log       off;
    }
}

# ── 도메인 확보 후: 아래를 켜고 위 server 블록의 listen 80을 리다이렉트로 바꾼다 ──
# server {
#     listen 443 ssl http2;
#     server_name beta.example.com;
#     ssl_certificate     /etc/letsencrypt/live/beta.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/beta.example.com/privkey.pem;
#     add_header Strict-Transport-Security "max-age=31536000" always;
#     ... 위 location 블록 동일 ...
# }
# server { listen 80; server_name beta.example.com; return 301 https://$host$request_uri; }
