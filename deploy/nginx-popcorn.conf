# 팝콘PC AI — 개발/스테이징 서버 · 1단계(HTTP + ACME 통로)
#
# 설치: /etc/nginx/sites-available/popcorn 로 복사 → sites-enabled 심볼릭 링크
#       → nginx -t → systemctl reload nginx
#
# **이 서버는 개발/스테이징이다**(decision-log I-01). 운영은 별도로 세운다.
# 정본 도메인 `popcornai.co.kr`은 운영 몫이고 여기는 `dev.` 서브도메인을 쓴다.
#
# **이 파일의 핵심은 Basic Auth다.** 고객 로그인이 아직 dev 어댑터(`"@" in email`이 전부)라
# 앱이 그대로 노출되면 남의 이메일로 그 사람 주문·결제를 볼 수 있다.
# 사용자 결정(2026-07-26): **Basic Auth로 사이트 전체를 봉쇄**한다.
# 실 OAuth 연동이 끝나면 걷어낼 수 있다 — 그 전엔 아니다.
#
# ── 왜 파일이 둘인가 (슬라이스 91) ──────────────────────────────
# 인증서를 받기 전에 TLS 블록을 켜두면 `ssl_certificate` 파일이 없어 **nginx가 아예 뜨지 않는다.**
# 그래서 단계를 나눈다:
#     1단계 = 이 파일          HTTP + ACME 통로만 열어둠  → 인증서 발급 가능 상태
#     2단계 = nginx-popcorn-tls.conf   443 + 80 리다이렉트  → 발급 성공 후 교체
# 전환 절차는 `deploy/README.md §7`.
#
# HTTP인 동안의 위험(정직 표기): 같은 망을 쓰는 상대가 **관리자 비밀번호**(슬라이스 70)와
# Basic Auth 비밀번호, 세션 쿠키를 평문으로 가로챌 수 있다. 2단계 전환이 이것을 끝낸다.

server {
    listen 80 default_server;
    # 도메인과 IP 둘 다 받는다 — 전환 중에도 기존 IP 접속을 끊지 않는다.
    server_name dev.popcornai.co.kr _;

    # ── ACME 통로 (Basic Auth보다 먼저 선언) ───────────────────
    # Let's Encrypt가 이 경로에 닿지 못하면 인증서를 못 받는다. Basic Auth가 사이트 전체를
    # 막고 있으므로 **여기만 열어준다**(`^~`로 정규식 location보다 우선). 챌린지 파일은
    # 무작위 토큰이고 발급 순간에만 존재한다 — 열어둬도 노출되는 정보가 없다.
    # 갱신(certbot renew)도 같은 경로를 쓰므로 2단계에서도 유지한다.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;        # sudo mkdir -p /var/www/certbot (README §7)
        default_type "text/plain";
    }

    # ── 접근 봉쇄 ──────────────────────────────────────────────
    auth_basic           "팝콘PC AI 내부 베타 - 직원 전용";
    auth_basic_user_file /etc/nginx/.htpasswd-popcorn;   # htpasswd로 생성(README 참조)

    # 서버 정보 노출 최소화
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 32m;      # 단가표 엑셀 업로드 여유
    access_log /var/log/nginx/popcorn.access.log;
    error_log  /var/log/nginx/popcorn.error.log;

    # ── 앱 프록시 ──────────────────────────────────────────────
    # API와 정적 목업 모두 FastAPI가 서빙한다(mockups를 / 에 마운트) — 경로 규칙이
    # 한 곳에만 있게 두는 편이 안전하다. 정적 분리는 성능이 문제가 될 때 검토.
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # 견적 응답이 2초대, 적재·집계는 더 걸릴 수 있다
    }

    # 헬스체크는 Basic Auth 없이 — 감시 도구가 붙을 수 있게(민감 정보 없음)
    location = /api/health {
        auth_basic off;
        proxy_pass       http://127.0.0.1:8000/api/health;
        access_log       off;
    }
}

# 2단계(HTTPS)는 이 파일에 주석으로 두지 않는다 — `nginx-popcorn-tls.conf`가 완성된 형태로 있다.
# 주석 예시는 아무도 검증하지 않아 낡는다(이 자리에 `beta.example.com`이 오래 남아 있었다).
