# 팝콘PC AI — 개발/스테이징 서버 nginx (2026-07-30 현행)
#
# 설치: /etc/nginx/sites-available/popcorn 로 복사 → nginx -t → systemctl reload nginx
#
# **이 파일은 서버에서 실제 돌고 있는 설정을 정본으로 옮긴 것이다(슬라이스 99).**
# 그전까지 리포에는 `server_name _;` + HTTP만 있는 낡은 설정이 있었고, 서버에는
# certbot이 고친 HTTPS 설정이 돌고 있었다 — 리포가 거짓을 말하는 상태였다.
# 누군가 리포 설정을 그대로 복사하면 돌아가는 HTTPS를 덮어썼을 것이다.
#
# ── 접근 정책 (2026-08-09 개정 · 사용자 결정) ──────────────────────
# 예전에는 Basic Auth가 사이트 전체를 봉쇄했다. 그런데 certbot 적용 과정에서
# `auth_basic` 지시어가 사라져 사이트가 공개된 상태로 이틀을 보냈다.
# 복구 대신 **경로별로 나누는** 쪽을 택했고(2026-07-30), 고객 경로를 404로 막았다.
#
# **2026-08-09: 고객 경로를 전부 열었다(사용자 결정).**
# 베타 테스터가 실제로 들어와 AI 상담 → 견적 → 구매까지 해보게 하는 것이
# 지금 단계의 목적이기 때문이다.
#
# ■ 열면서 감수한 것 — 다음 사람이 반드시 알아야 한다
#   고객 인증은 **아직 dev 어댑터다.** `api/customer_auth.py`의 검증은
#   `if "@" not in email` 한 줄이 전부이고 비밀번호도 OAuth도 인증 메일도 없다.
#   즉 **아무나 남의 이메일을 입력해 그 사람 세션을 받고**, `/api/my/` 로
#   그 사람의 주문·결제·환불·후기를 볼 수 있다.
#   개방 시점의 실회원은 6명이고 전부 우리 테스트 계정이었다.
#
#   **테스터에게 실제 개인정보를 넣지 말라고 공지해야 한다.**
#   실 OAuth(카카오·네이버·구글)가 이 구멍의 유일한 해소다 —
#   붙일 자리는 `api/admin_profile.PROVIDER_KO` + `_verify_google()` 로 좁혀져 있다.
#
# 관리자는 계속 열려 있고, 슬라이스 70의 비밀번호 인증 +
# `/api/admin/*` 미들웨어 게이트가 막는다(이건 그대로다).

server {
    # 2026-08-21: DNS 전파 완료(하네스 실측) — www·apex 를 같은 인증서·같은 서버 블록에 담는다.
    # (admin/www/apex 세 이름 모두 이 블록으로 들어온다. 관리자 경로 노출 여부는 아직 미정 — 막지 않는다.)
    server_name admin.popcornai.co.kr www.popcornai.co.kr popcornai.co.kr;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 32m;      # 단가표 엑셀 업로드 여유
    access_log /var/log/nginx/popcorn.access.log;
    error_log  /var/log/nginx/popcorn.error.log;

    # ── 고객 영역: 열려 있다 (2026-08-09) ─────────────────────────
    # 2026-07-30 ~ 2026-08-09 사이에는 아래 10개 경로를 404로 막고 있었다.
    # 사용자 결정으로 전부 걷었다(위 「접근 정책」의 감수 사항을 먼저 읽어라).
    #
    # 되돌리려면 이 자리에 다시 넣는다 — **반드시 `location /` 앞에** 둔다.
    # `^~` 는 접두어 우선 매칭이라 정규식 location 보다 먼저 걸린다.
    # 404를 쓴다(403이 아니라) — 아직 열지 않은 것의 존재를 알리지 않기 위해서다.
    #
    #   location ^~ /mvp1/            { return 404; }   # 고객 화면 13개
    #   location ^~ /api/auth/        { return 404; }   # 고객 로그인·로그아웃·me
    #   location ^~ /api/my/          { return 404; }   # 고객 주문·결제·환불·후기
    #   location ^~ /api/candidates   { return 404; }   # 후보 카운터(S1)
    #   location ^~ /api/recommend    { return 404; }   # 견적 산출(S2)
    #   location ^~ /api/swap/        { return 404; }   # 부품 교체(S3)
    #   location ^~ /api/orders       { return 404; }   # 주문 생성(S4)
    #   location ^~ /api/ops          { return 404; }   # 고객용 운영 모드 조회
    #   location ^~ /api/showcase     { return 404; }   # 랜딩 대표 구성
    #   location ^~ /api/promo-click  { return 404; }   # 근거 클릭 수집
    #
    # **다시 막을 때 주의: /api/auth/ 와 /api/admin/auth/ 는 다른 경로다.**
    # nginx 접두어 매칭은 URI 시작부터 보므로 /api/admin/auth/login 은 위에 걸리지
    # 않는다. 잘못 막아 관리자 로그인까지 죽이면 아무도 들어올 수 없다.

    # ── 앱 프록시 ─────────────────────────────────────────────────
    # API와 관리자 화면 모두 FastAPI가 서빙한다(mockups를 / 에 마운트).
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # 견적 응답이 2초대, 적재·집계는 더 걸릴 수 있다
    }

    # 헬스체크는 감시 도구가 붙을 수 있게 열어 둔다(민감 정보 없음)
    location = /api/health {
        proxy_pass       http://127.0.0.1:8000/api/health;
        access_log       off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.popcornai.co.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.popcornai.co.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── 80: ACME 통로만 남기고 HTTPS로 ──────────────────────────────────
server {
    listen 80 default_server;
    server_name admin.popcornai.co.kr www.popcornai.co.kr popcornai.co.kr;

    # 갱신도 이 경로를 쓴다 — 막히면 90일 뒤 조용히 만료된다.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # $host = 요청의 Host 헤더(포트 제외, 없으면 매칭된 server_name 으로 대체) — 2026-08-21.
    # 고정 도메인(admin.popcornai.co.kr)으로 박아두면 www.로 들어온 사람이 admin.으로 튕긴다.
    location / { return 301 https://$host$request_uri; }
}
