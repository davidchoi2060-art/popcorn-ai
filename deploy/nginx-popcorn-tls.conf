# 팝콘PC AI — 개발/스테이징 서버 · 2단계(HTTPS)
#
# **인증서를 받은 뒤에만 설치한다.** 파일이 없는 상태로 켜면 nginx가 뜨지 않는다.
# 절차는 `deploy/README.md §7`. 1단계 파일 = `nginx-popcorn.conf`.
#
# 설치: /etc/nginx/sites-available/popcorn 로 **덮어쓰기** → nginx -t → systemctl reload nginx
#       (1단계와 같은 자리를 쓴다 — 두 파일이 동시에 enabled되면 서로 충돌한다)
#
# 이 서버는 개발/스테이징이다(decision-log I-01). 정본 `popcornai.co.kr`은 운영 몫이다.
#
# 전환하면 끝나는 것: 관리자 비밀번호(슬라이스 70)·Basic Auth 비밀번호·세션 쿠키의 평문 전송.
# 전환 후 반드시 `/etc/popcorn-ai.env`에 `COOKIE_SECURE=1`을 넣고 popcorn-api를 재시작한다
# (코드 수정 없이 환경변수 하나 — 안 켜면 쿠키가 계속 평문 경로로도 나간다).

# ── 80: ACME 통로만 남기고 전부 HTTPS로 ─────────────────────────
server {
    listen 80 default_server;
    server_name dev.popcornai.co.kr _;

    # 갱신도 이 경로를 쓴다 — 리다이렉트보다 먼저 선언해야 한다.
    # 여기가 막히면 90일 뒤 갱신이 조용히 실패하고 인증서가 만료된다.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    # IP로 들어와도 도메인으로 보낸다 — `$host`를 쓰면 https://34.47.124.184 로 가서
    # 인증서 이름이 안 맞아 경고가 뜬다. 목적지를 고정한다.
    location / {
        return 301 https://dev.popcornai.co.kr$request_uri;
    }
}

# ── 443: 본체 ──────────────────────────────────────────────────
server {
    # nginx 1.25.1+ 에서는 `listen 443 ssl;` + `http2 on;`이 권장된다.
    # Ubuntu 24.04는 nginx 1.24라 아래 형태가 맞다(1.25부터 deprecation 경고).
    listen 443 ssl http2;
    server_name dev.popcornai.co.kr;

    ssl_certificate     /etc/letsencrypt/live/dev.popcornai.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.popcornai.co.kr/privkey.pem;

    # certbot이 깔아주는 options-ssl-nginx.conf를 include하지 않는다 —
    # python3-certbot-nginx를 설치해야 생기는 파일이고, 우리는 --webroot로 발급하므로
    # 있으리라는 보장이 없다. 없는 파일을 include하면 nginx가 뜨지 않는다.
    # Mozilla intermediate 기준을 여기에 직접 적는다.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:PopcornTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── 접근 봉쇄 (1단계와 동일 — HTTPS가 됐다고 걷는 게 아니다) ──
    # HTTPS는 전송 구간을 지킬 뿐 "누가 들어오는가"를 지키지 않는다.
    # 고객 로그인이 dev 어댑터인 한 이 빗장은 그대로 있어야 한다.
    auth_basic           "팝콘PC AI 내부 베타 - 직원 전용";
    auth_basic_user_file /etc/nginx/.htpasswd-popcorn;

    server_tokens off;
    # includeSubDomains를 넣지 않는다 — popcornai.co.kr의 다른 호스트(운영 예정)까지
    # 강제하면 그쪽 준비가 끝나기 전에 접근이 막힌다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 32m;      # 단가표 엑셀 업로드 여유
    access_log /var/log/nginx/popcorn.access.log;
    error_log  /var/log/nginx/popcorn.error.log;

    # ── 앱 프록시 ──────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # https로 고정하지 않고 $scheme을 쓴다 — 이 블록은 항상 https지만
        # 값을 박아두면 1단계로 되돌릴 때 거짓말이 된다.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # 견적 응답 2초대, 적재·집계는 더 걸린다
    }

    location = /api/health {
        auth_basic off;
        proxy_pass       http://127.0.0.1:8000/api/health;
        access_log       off;
    }
}
