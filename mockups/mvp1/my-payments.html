<title>팝콘PC AI · 결제 내역</title>
<style>

body{background:#f1eee8;font-family:var(--font);-webkit-font-smoothing:antialiased;color:#1a1a1e}
.msym{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.card{background:#fff;border:1px solid #ece9e3;border-radius:20px;padding:22px}
</style>
  <link rel="stylesheet" href="../shared/fonts/fonts.css">
    <link rel="stylesheet" href="../../design-system/tokens.css">
</head>
<body>

<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #e6e2da;">
  <div style="max-width:920px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="main-landing.html" style="font-size:16px;font-weight:900;color:#17171b;text-decoration:none;">팝콘PC <span style="color:#2b5fd9;">AI</span></a>
      <span style="width:1px;height:15px;background:#d8d4cc;"></span>
      <span style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:#3a3a40;"><span class="msym" style="font-size:18px;color:#2b5fd9;">credit_card</span>결제 내역</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="my-orders.html" style="font-size:13px;font-weight:800;color:#2b5fd9;text-decoration:none;">주문 내역 →</a>
      <a href="my-page.html" style="font-size:13px;font-weight:800;color:#8a8578;text-decoration:none;">마이페이지</a>
    </div>
  </div>
</header>

<main style="max-width:920px;margin:0 auto;padding:26px 22px 70px;">

  <div class="card" style="display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin-bottom:16px;">
    <div><div style="font-size:12px;color:#8a8578;font-weight:700;">이번 달 결제</div><b id="mp-month" style="font-size:22px;color:#17171b;">1,735,000원</b></div>
    <span style="width:1px;height:26px;background:#ece9e3;"></span>
    <div><div id="mp-total-label" style="font-size:12px;color:#8a8578;font-weight:700;">누적 결제 (3건)</div><b id="mp-total" style="font-size:22px;color:#17171b;">3,831,000원</b></div>
    <span style="margin-left:auto;font-size:12px;color:#8a8578;font-weight:600;">결제 방식(자체/쇼핑몰 인계)과 무관하게 전 건이 기록됩니다.</span>
  </div>

  <div class="card" style="padding:8px 22px;">
    <div id="plist"></div>
  </div>

  <p style="margin:14px 4px 0;font-size:12px;color:#a29d92;font-weight:600;">환불이 승인되면 이 목록에 <b>환불</b> 행이 별도로 추가됩니다 — 승인·취소·환불이 전부 한 줄씩 남는 결제 관점의 원장입니다.</p>

</main>

<script>
(function(){
var won=function(n){return n.toLocaleString()+'원';};
var stCol={'승인':['#eaf1fd','#2149b0'],'취소':['#f4f2ec','#6b6b73'],'환불':['#fbecec','#8a1f22']};
function render(rows){
 if(!rows.length){document.getElementById('plist').innerHTML='<div style="padding:26px 0;text-align:center;font-size:13px;color:#8a8578;font-weight:600;">아직 결제 내역이 없습니다.</div>';return;}
 document.getElementById('plist').innerHTML=rows.map(function(p){
  var c=stCol[p.state]||['#f4f2ec','#6b6b73'];
  return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #f0eee9;">'
   +'<span style="flex:0 0 92px;font-size:12.5px;color:#8a8578;font-weight:700;">'+p.at+'</span>'
   +'<div style="flex:1;min-width:180px;"><b style="font-size:14px;color:#17171b;">'+p.method+'</b> <span style="font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;'+(p.mode==='own'?'background:#eaf1fd;color:#2149b0;':'background:#f2edfb;color:#4a2a94;')+'">'+(p.mode==='own'?'자체':'쇼핑몰 인계')+'</span>'
   +'<div style="font-size:12px;color:#8a8578;font-weight:600;margin-top:2px;"><a href="my-orders.html?id='+p.order+'" style="color:#2b5fd9;text-decoration:none;font-weight:800;">'+p.order+'</a> 주문</div></div>'
   +'<span style="font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;background:'+c[0]+';color:'+c[1]+';">'+p.state+'</span>'
   +'<b style="font-size:15px;color:#17171b;font-variant-numeric:tabular-nums;">'+won(p.amount)+'</b></div>';
 }).join('');
}
// 미로그인 상태에서도 결제 3건(1,735,000원 등)이 그대로 보이는 문제가 있었다(2026-08-20
// 확인자 실측 — anyLoginPrompt=false·anyErrorText=false로 100% 재현). 원인은 이 자리에
// 있던 하드코딩 더미 PAYS를 로그인 확인 없이 먼저 그리고, 아래 LIVE 블록의
// `.catch(function(){})`가 빈 함수라 요청 실패·미로그인 시에도 그대로 남겨 둔 것이었다.
// my-page.html이 오늘 같은 문제를 푼 방식(로그아웃/0건/실패 세 상태 + 401은
// popcornAuth.expired())을 따라 더미 배열을 지운다.
//
// ⚠ 위 KPI 카드(#mp-month·#mp-total)의 정적 마크업 "1,735,000원"·"3,831,000원"은 지우지
// 않는다 — tests/regression.py의 BAKED_CX_DEFER가 my-payments.html에서 이 두 값이 계속
// 보이는 것을 전제로 유예해 두었다(HANDOFF §2 · 만료 2026-09-30, 그때까지 지우면 "유예
// 목록에 낡은 항목" 검사가 실패한다). 대신 로그인 상태를 알기 전에 즉시(동기) 표시만
// 비운다 — 소스의 정적 문자열은 남기고 실제 사용자 화면에는 노출하지 않는다.
document.getElementById('mp-month').textContent='—';
document.getElementById('mp-total').textContent='—';
document.getElementById('mp-total-label').textContent='누적 결제';

function noteBox(msg){return '<div style="padding:26px 0;text-align:center;font-size:13px;color:#8a8578;font-weight:600;">'+msg+'</div>';}
function renderState(msg){
 document.getElementById('plist').innerHTML=noteBox(msg);
 document.getElementById('mp-month').textContent='—';
 document.getElementById('mp-total').textContent='—';
 document.getElementById('mp-total-label').textContent='누적 결제';
}

// ---- LIVE — popcorn-member 있고 API 성공 시에만 결제 원장을 그린다 ----
function fmtT(iso){
 var d=new Date(iso),now=new Date();
 var hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 if(d.toDateString()===now.toDateString())return '오늘 '+hm;
 return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+hm;
}
var mem=null;try{mem=JSON.parse(localStorage.getItem('popcorn-member')||'null');}catch(e){}
if(mem&&mem.email){
 fetch('/api/my/payments')
  .then(function(r){if(r.status===401){popcornAuth.expired();throw new Error(401);}
                     if(!r.ok)throw new Error(r.status);return r.json();})
  .then(function(d){
   var rows=d.items.map(function(p){return {at:p.at?fmtT(p.at):'—',order:p.order_no,method:p.method,mode:p.mode,amount:p.amount,state:p.status};});
   render(rows);
   // KPI — 응답 rows 단일 원천. 합계는 승인·환불만(취소는 돈이 안 움직임), 건수는 원장 전 행.
   var now=new Date(),month=0,sum=0;
   d.items.forEach(function(p){
    if(p.status!=='승인'&&p.status!=='환불')return;
    sum+=p.amount;
    if(p.at){var t=new Date(p.at);if(t.getFullYear()===now.getFullYear()&&t.getMonth()===now.getMonth())month+=p.amount;}
   });
   document.getElementById('mp-month').textContent=won(month);
   document.getElementById('mp-total').textContent=won(sum);
   document.getElementById('mp-total-label').textContent='누적 결제 ('+d.items.length+'건)';
  }).catch(function(){renderState('결제 내역을 불러오지 못했습니다 — 잠시 후 다시 시도해 주세요.');});
}else{
 renderState('로그인하면 결제 내역을 볼 수 있어요.');
}
})();
</script>
