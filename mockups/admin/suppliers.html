<!DOCTYPE html>
<html lang="ko" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팝콘PC 관리자 · 공급처</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/user.css">
</head>
<body data-screen-id="ADM-SRC-030" data-domain="sourcing">
<main class="main" id="top">
  <div class="content">
    <nav class="mb-3" aria-label="breadcrumb"><ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="index.html">홈</a></li>
      <li class="breadcrumb-item"><a href="#!">가격 · 매입</a></li>
      <li class="breadcrumb-item active">공급처</li>
    </ol></nav>

    <div class="d-flex flex-wrap justify-content-between align-items-end mb-3 gap-2">
      <div>
        <h2 class="mb-1">공급처
          <span class="badge badge-phoenix badge-phoenix-warning align-middle fs-10">ADM-SRC-030</span>
          <span id="dataSrc" class="badge badge-phoenix badge-phoenix-secondary align-middle fs-10">불러오는 중</span>
        </h2>
        <p class="mb-0 fs-9 text-body-tertiary">
          부품을 사 오는 곳입니다. <b>여기가 비어 있으면 매입가를 넣을 대상이 없어</b>
          판매가가 산정되지 않고 추천 후보도 생기지 않습니다.
        </p>
      </div>
      <a href="products.html" class="btn btn-phoenix-secondary btn-sm">상품 관리 →</a>
    </div>

    <div id="host" hidden></div>
    <div id="fallback" class="alert alert-subtle-warning fs-9" role="alert">
      공급처를 불러오는 중입니다 — 서버에 연결되면 표시됩니다.
    </div>
  </div>
</main>

<script>
/* 감시자 — 별도 스크립트여야 한다. 아래 본 스크립트가 파싱 실패로 죽으면 화면이
   "불러오는 중"에 영원히 멈추고 사용자에겐 아무 신호도 없다(슬라이스 92 전례). */
window.__supAlive = false;
setTimeout(function(){
  if (window.__supAlive) return;
  var fb = document.getElementById("fallback");
  var src = document.getElementById("dataSrc");
  if (fb) { fb.textContent = "화면 스크립트가 실행되지 않았습니다 — 새로고침해도 같으면 관리자에게 알려주세요."; fb.hidden = false; }
  if (src) src.textContent = "화면 오류";
}, 5000);
</script>
<script>
(function(){
  window.__supAlive = true;
  var host = document.getElementById("host");
  var fb   = document.getElementById("fallback");
  var src  = document.getElementById("dataSrc");

  function esc(s){ return String(s==null?"":s).replace(/[<>&"]/g,
    function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]; }); }
  function toast(m){
    var t=document.getElementById("__t");
    if(!t){ t=document.createElement("div"); t.id="__t";
      t.style.cssText="position:fixed;bottom:26px;left:50%;transform:translateX(-50%);"
        +"background:#141824;color:#fff;font-size:13px;font-weight:700;padding:11px 20px;"
        +"border-radius:10px;z-index:9999;opacity:0;transition:.2s;max-width:80vw;";
      document.body.appendChild(t); }
    t.textContent=m; t.style.opacity="1";
    clearTimeout(t._x); t._x=setTimeout(function(){t.style.opacity="0";},4000);
  }
  function dash(v){ return (v===null||v===undefined||v==="") ? "—" : esc(v); }
  function err(j){
    var d = j && j.detail;
    if (d && typeof d === "object") return d.message || d.error || "요청을 처리하지 못했습니다";
    return d || "요청을 처리하지 못했습니다";
  }

  /* 빈 상태에서 무엇을 해야 하는지 화면이 직접 말한다. 운영 시작 순서 문서를
     따로 읽어야만 알 수 있으면 그건 화면이 일을 안 한 것이다. */
  function emptyBox(){
    return [
      '<div class="card mb-3 border border-warning"><div class="card-body">',
        '<h5 class="mb-2">아직 공급처가 없습니다</h5>',
        '<p class="fs-9 text-body-tertiary mb-2">',
          '공급처는 <b>상품보다 먼저</b> 만들어야 합니다. 순서가 이렇습니다:</p>',
        '<div class="fs-9 mb-0">',
          '<span class="badge badge-phoenix badge-phoenix-primary">1 공급처</span> → ',
          '<span class="badge badge-phoenix badge-phoenix-secondary">2 상품 등록</span> → ',
          '<span class="badge badge-phoenix badge-phoenix-secondary">3 사양 검수</span> → ',
          '<span class="badge badge-phoenix badge-phoenix-secondary">4 매입가 · 판매가</span> → ',
          '<span class="badge badge-phoenix badge-phoenix-secondary">5 재고 입고</span>',
        '</div>',
      '</div></div>'
    ].join("");
  }

  function rowHtml(s){
    var stopped = (s.status === "중지");
    var badge = stopped
      ? '<span class="badge badge-phoenix badge-phoenix-secondary">중지</span>'
      : '<span class="badge badge-phoenix badge-phoenix-primary">활성</span>';
    return [
      '<tr data-id="', s.id, '"', (stopped ? ' class="opacity-50"' : ''), '>',
        '<td><b>', esc(s.name), '</b></td>',
        '<td>', dash(s.platform), '</td>',
        '<td class="fs-10">', dash(s.brands), '</td>',
        '<td class="text-end">', s.linked_products, '</td>',
        '<td class="text-end">', s.price_files, '</td>',
        '<td>', badge, '</td>',
        '<td class="text-end">',
          '<button class="btn btn-phoenix-secondary btn-sm sup-edit" data-id="', s.id, '">수정</button> ',
          '<button class="btn btn-phoenix-', (stopped ? 'primary' : 'secondary'),
            ' btn-sm sup-toggle" data-id="', s.id, '">',
            (stopped ? '활성으로' : '중지'), '</button>',
        '</td>',
      '</tr>'
    ].join("");
  }

  function render(d){
    DATA = d;
    var parts = ['<div class="alert alert-subtle-info fs-10 mb-3">' + esc(d.note) + '</div>'];
    if (d.empty) parts.push(emptyBox());

    parts.push([
      '<div class="card mb-3"><div class="card-body">',
        '<h5 class="mb-3">공급처 등록</h5>',
        '<div class="row g-2 align-items-end">',
          '<div class="col-sm-4">',
            '<label class="form-label fs-9" for="n-name">이름 <span class="text-danger">*</span></label>',
            '<input id="n-name" class="form-control form-control-sm" maxlength="100" placeholder="예: 용산 OO상사">',
          '</div>',
          '<div class="col-sm-3">',
            '<label class="form-label fs-9" for="n-plat">구분</label>',
            '<input id="n-plat" class="form-control form-control-sm" maxlength="50" placeholder="예: 용산 / 총판">',
          '</div>',
          '<div class="col-sm-3">',
            '<label class="form-label fs-9" for="n-brand">취급 브랜드</label>',
            '<input id="n-brand" class="form-control form-control-sm" maxlength="200" placeholder="예: MSI, ASUS">',
          '</div>',
          '<div class="col-sm-2">',
            '<button id="add" class="btn btn-primary btn-sm w-100">등록</button>',
          '</div>',
        '</div>',
        '<p class="fs-10 text-body-quaternary mb-0 mt-2">',
          '같은 이름은 만들 수 없습니다 — 매입가를 어느 쪽에 넣었는지 알 수 없게 됩니다.</p>',
      '</div></div>'
    ].join(""));

    parts.push([
      '<div class="card"><div class="card-body">',
        '<div class="d-flex justify-content-between align-items-center mb-3">',
          '<h5 class="mb-0">공급처 목록</h5>',
          '<span class="fs-10 text-body-tertiary">활성 ', d.active, ' / 전체 ', d.total, '</span>',
        '</div>',
        '<div class="table-responsive"><table class="table table-sm align-middle fs-9 mb-0">',
          '<thead><tr class="text-body-tertiary">',
            '<th>이름</th><th>구분</th><th>취급 브랜드</th>',
            '<th class="text-end">매입가 연결</th><th class="text-end">단가표</th>',
            '<th>상태</th><th></th>',
          '</tr></thead><tbody id="rows">',
          (d.items.length ? d.items.map(rowHtml).join("")
            : '<tr><td colspan="7" class="text-center text-body-tertiary py-4">등록된 공급처가 없습니다</td></tr>'),
          '</tbody>',
        '</table></div>',
        '<p class="fs-10 text-body-quaternary mb-0 mt-2">',
          '삭제는 없습니다 — 매입 이력이 걸려 있어 지우면 과거 기록이 깨집니다. ',
          '중지하면 새 매입가 입력에서만 빠지고 지난 기록은 그대로 남습니다.</p>',
      '</div></div>'
    ].join(""));

    host.innerHTML = parts.join("");
    host.hidden = false;
    fb.hidden = true;
    wire();
  }

  var DATA = null;

  function wire(){
    document.getElementById("add").onclick = function(){
      var b = this;
      var body = {
        name:     document.getElementById("n-name").value.trim(),
        platform: document.getElementById("n-plat").value.trim(),
        brands:   document.getElementById("n-brand").value.trim()
      };
      if(!body.name){ toast("공급처 이름을 입력하세요"); return; }
      b.disabled = true;
      fetch("/api/admin/suppliers", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(body)
      }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(res){
          b.disabled = false;
          if(!res.ok){ toast(err(res.j)); return; }
          toast(res.j.note);          // 서버가 준 문구를 그대로 — 화면이 지어내지 않는다
          load();
        })
        .catch(function(){ b.disabled = false; toast("서버에 연결할 수 없습니다"); });
    };

    host.querySelectorAll(".sup-edit").forEach(function(btn){
      btn.onclick = function(){
        var s = DATA.items.filter(function(x){ return String(x.id) === btn.getAttribute("data-id"); })[0];
        if(!s) return;
        var name = prompt("공급처 이름", s.name);
        if(name === null) return;
        var plat = prompt("구분 (예: 용산 / 총판)", s.platform || "");
        if(plat === null) return;
        var brand = prompt("취급 브랜드", s.brands || "");
        if(brand === null) return;
        patch(s.id, {name:name.trim(), platform:plat.trim(), brands:brand.trim(), status:s.status});
      };
    });

    host.querySelectorAll(".sup-toggle").forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-id");
        var s = DATA.items.filter(function(x){ return String(x.id) === id; })[0];
        if(!s) return;
        if(s.status === "중지"){
          patch(s.id, {name:s.name, platform:s.platform, brands:s.brands, status:"활성"});
          return;
        }
        /* 중지는 누르기 전에 영향을 먼저 보여준다(슬라이스 67·75와 같은 원칙) */
        fetch("/api/admin/suppliers/" + encodeURIComponent(id) + "/impact")
          .then(function(r){ return r.json(); })
          .then(function(im){
            if(!confirm(s.name + " 중지\n\n" + im.note + "\n\n중지할까요?")) return;
            patch(s.id, {name:s.name, platform:s.platform, brands:s.brands, status:"중지"});
          })
          .catch(function(){ toast("영향을 확인하지 못했습니다"); });
      };
    });
  }

  function patch(id, body){
    fetch("/api/admin/suppliers/" + encodeURIComponent(id), {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if(!res.ok){ toast(err(res.j)); return; }
        toast(res.j.note);
        load();
      })
      .catch(function(){ toast("서버에 연결할 수 없습니다"); });
  }

  function load(){
    return fetch("/api/admin/suppliers")
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        src.textContent = "실데이터 · Cloud SQL";
        src.classList.remove("badge-phoenix-secondary");
        src.classList.add("badge-phoenix-primary");
        render(d);
      })
      .catch(function(e){
        // 서버가 없으면 지어내지 않는다 — 못 받았다고 말한다
        src.textContent = "연결 안 됨";
        fb.textContent = "공급처를 불러오지 못했습니다 (" + e.message + ") — "
          + "관리자로 로그인했는지 확인하세요.";
        fb.hidden = false;
        host.hidden = true;
      });
  }
  load();
})();
</script>
<script src="../shared/admin-auth.js"></script>
<script src="../shared/ui-progress.js"></script>
<script src="../shared/su-icons.js"></script>
<script src="../shared/admin-panel.js"></script>
<script src="../shared/admin-menu.js"></script>
</body>
</html>
