<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>팝콘AI · 회원가입</title>
  <link rel="stylesheet" href="../shared/fonts/fonts.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="member.css">
  <script defer src="join.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html" aria-label="팝콘AI 처음 화면"><strong>팝콘AI</strong></a><span class="demo-label">회원가입</span></header>
  <main class="mb-page">
    <section class="mb-card" aria-labelledby="mb-join-title">
      <h1 id="mb-join-title">가입 동의</h1>
      <p id="mb-join-sub" class="mb-sub">팝콘AI 회원이 되어 더 편리하게 이용하세요.</p>
      <form id="mb-join" novalidate hidden>
        <div class="mb-check mb-all"><input id="mb-all" type="checkbox"><label for="mb-all">전체 동의</label></div>
        <div class="mb-check"><input id="mb-terms" type="checkbox" data-consent="terms"><label for="mb-terms">[필수] 이용약관 동의</label><a href="terms.html" target="_blank" rel="noopener">전문 보기 ›</a></div>
        <div class="mb-check"><input id="mb-privacy" type="checkbox" data-consent="privacy"><label for="mb-privacy">[필수] 개인정보 수집·이용 동의</label><a href="privacy.html" target="_blank" rel="noopener">전문 보기 ›</a></div>
        <div class="mb-check"><input id="mb-age14" type="checkbox" data-consent="age14"><label for="mb-age14">[필수] 만 14세 이상입니다</label></div>
        <div class="mb-field"><label for="mb-nickname">닉네임 <span class="muted">(바꿀 수 있어요)</span></label><input id="mb-nickname" maxlength="100" autocomplete="nickname"></div>
        <button id="mb-submit" class="primary mb-wide" type="submit" disabled>동의하고 가입하기</button>
        <p id="mb-error" class="mb-error" role="alert" hidden></p>
        <p class="mb-info"><span aria-hidden="true">ⓘ</span><span>다른 방법으로 이미 가입하셨다면, 그 방법으로 로그인해 주세요.</span></p>
        <p class="mb-foot">결제와 배송은 팝콘PC 쇼핑몰에서 이루어져요. 이 화면에서는 결제 정보를 받지 않아요.</p>
      </form>
      <div id="mb-expired" hidden>
        <p class="mb-sub">시간이 지나 다시 로그인이 필요해요.</p>
        <a class="primary mb-wide mb-linkbtn" href="index.html">처음 화면으로</a>
      </div>
    </section>
  </main>
  <noscript>회원가입은 JavaScript가 필요합니다.</noscript>
</body></html>
