<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>팝콘AI · PC 상담 대화</title>
  <link rel="stylesheet" href="../shared/fonts/fonts.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="talk.css"><link rel="stylesheet" href="member.css">
  <script defer src="live-model.js"></script><script defer src="api-client.js"></script><script defer src="live-flow.js"></script><script defer src="live-photo.js"></script><script defer src="talk.js"></script>
  <script defer src="member.js"></script>
</head>
<body class="tk">
  <header class="topbar"><a class="brand" href="index.html" aria-label="팝콘AI 처음 화면"><strong>팝콘AI</strong></a><span class="demo-label">PC 상담</span><nav aria-label="상담 메뉴"><button type="button" data-action="new">새 상담</button><a class="nav-link" href="index.html#saved">내 견적</a><a id="tk-old" class="nav-link" href="index.html#welcome">기존 상담 화면</a></nav></header>
  <div class="tk-layout">
    <main class="tk-chat" aria-label="상담 대화">
      <div id="tk-log" class="tk-log" role="log" aria-label="상담 내용" aria-live="polite"></div>
      <p id="tk-status" class="tk-status" role="status" aria-live="polite" hidden></p>
      <form id="tk-form" class="tk-form"><label class="sr-only" for="tk-input">PC로 할 일이나 궁금한 점</label><textarea id="tk-input" rows="2" maxlength="20000" placeholder="PC로 할 일이나 궁금한 점을 적어주세요."></textarea><span id="tk-count" class="muted tk-count" aria-live="polite"></span><button id="tk-send" class="primary" type="submit">보내기</button></form>
      <div id="tk-starters" class="tk-examples" aria-label="상담 시작" hidden></div>
      <small class="muted tk-foot">상품과 가격은 조회 시점 기준이에요.</small>
    </main>
    <aside id="tk-now" class="tk-now" aria-label="지금 견적">
      <button type="button" class="tk-now-toggle" data-action="toggle-now" aria-expanded="false" aria-controls="tk-now-body"><span id="tk-now-summary">지금 견적</span></button>
      <div id="tk-now-body" class="tk-now-body"></div>
    </aside>
  </div>
  <noscript>PC 상담은 JavaScript가 필요합니다.</noscript>
</body></html>
