# 개발 서버에서 손님 화면 대화를 다시 돌려 본다 -- 공개 고객 API 만 부른다(비밀값·DB 없음).
name: 화면 대화 다시 돌리기

on:
  workflow_dispatch:
    inputs:
      text:
        description: '문장 하나만 보낼 때(비우면 중헌 님 대화). 긴 글은 @long:글|끝 문장|글자 수'
        default: ''

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          TEXT: ${{ inputs.text }}
        run: python tools/quality/screen_replay.py | tee -a "$GITHUB_STEP_SUMMARY"
