# 몰 상품 사진과 팝콘AI 대표 사진을 «읽기만» 해서 데이터 가지에 올린다 — 손으로 부르는 전용.
#
# 왜: 새 상품 대표 사진을 만들려면 원본 사진을 봐야 하는데 클라우드 작업창은
# popcornpc.co.kr·popcornai.co.kr 에 닿지 않는다(403). (2026-10-21 사장님 「이미지 작업은 좀 멋지게」)
#
# 이 워크플로가 «하지 않는» 것:
#   · sudo·DB 를 쓰지 않는다. 공개 GET 만 부른다.
#   · main 에 쓰지 않는다 — 결과는 data/mall-images 가지에 덮어쓴다.
#
# ⚠ pull_request 트리거는 절대 넣지 않는다.
name: 몰 상품 사진 받기

on:
  workflow_dispatch:
    inputs:
      codes:
        description: '몰 상품번호 (쉼표·범위, 예: 130569-130679,112660)'
        required: false
        default: ''
      ai_codes:
        description: '팝콘AI 대표 사진(카드)도 받을 상품번호 (쉼표, 비교용)'
        required: false
        default: ''
      paths:
        description: '팝콘AI 공개 사진 경로도 받는다 (쉼표, 예: /api/product-images/119270/detail)'
        required: false
        default: ''
      detail:
        description: '상세 페이지 안 사진 주소도 모은다'
        type: boolean
        default: true

concurrency:
  group: popcorn-mall-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, popcorn-vm]
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: 받기
        shell: bash
        env:
          CODES: ${{ inputs.codes }}
          AI_CODES: ${{ inputs.ai_codes }}
          PATHS: ${{ inputs.paths }}
          DETAIL: ${{ inputs.detail }}
        run: |
          set -uo pipefail
          rm -rf out; mkdir -p out/mall out/ai out/html
          UA='Mozilla/5.0 (popcorn-ai image fetch)'
          expand() { for r in ${1//,/ }; do case "$r" in *-*) seq "${r%-*}" "${r#*-}";; *) echo "$r";; esac; done; }
          for code in $(expand "$CODES"); do
            d=$((code / 1000))
            for sz in 600 1000 800 500 300 ""; do
              suf=${sz:+_$sz}
              curl -sS -A "$UA" -o "out/mall/${code}${suf}.jpg" -w "$code $sz %{http_code} %{size_download} %{content_type}\n" \
                "https://www.popcornpc.co.kr/data/pimg/$d/${code}${suf}.jpg" >> out/mall_status.txt || true
              [ -s "out/mall/${code}${suf}.jpg" ] && file -b "out/mall/${code}${suf}.jpg" | grep -qi image || rm -f "out/mall/${code}${suf}.jpg"
            done
            if [ "$DETAIL" = "true" ]; then
              curl -sS -A "$UA" "https://www.popcornpc.co.kr/shop/system_detail.html?pd_no=$code" -o "out/html/$code.html" || true
              grep -oiE '(src|data-src)="[^"]+\.(jpe?g|png|gif|webp)[^"]*"' "out/html/$code.html" 2>/dev/null \
                | sed -E 's/^[^"]*"//; s/"$//' | sort -u | sed "s|^|$code |" >> out/detail_images.txt || true
            fi
            sleep 0.2
          done
          for code in ${AI_CODES//,/ }; do
            curl -sS -o "out/ai/${code}_card.webp" -w "$code card %{http_code} %{size_download}\n" \
              "https://popcornai.co.kr/api/customer/products/$code/representative-image?size=card" >> out/ai_status.txt || true
          done
          for path in ${PATHS//,/ }; do
            case "$path" in /api/product-images/*|/api/customer/products/*) ;; *) continue;; esac
            name=$(echo "$path" | tr -c 'a-zA-Z0-9\n' '_')
            curl -sS -o "out/ai/$name" -w "$path %{http_code} %{size_download} %{content_type}\n" "https://popcornai.co.kr$path" >> out/ai_status.txt || true
          done
          # 상세 HTML 은 크고 쓸 데가 주소 목록뿐이라 올리지 않는다.
          rm -rf out/html
          find out -type f | wc -l
          du -sh out

      - name: 결과를 데이터 가지에 올린다
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          [ -d out ] || exit 0
          tmp=$(mktemp -d)
          cp -r out/. "$tmp"/
          cd "$tmp"
          git init -q
          git config user.name 'popcorn-runner'
          git config user.email 'runner@popcornai.local'
          git add -A
          git commit -qm "몰 상품 사진 (run $RUN_ID)"
          git push -q --force "https://x-access-token:$TOKEN@github.com/$REPO" HEAD:refs/heads/data/mall-images
          echo "데이터 가지 갱신: data/mall-images"
