# 몰 완제PC 공개 페이지를 «읽기만» 한다 — 손으로 부르는 전용.
#
# 왜 러너에서 도는가: 클라우드 작업창은 에이전트 프록시가 허용한 도메인만
# 통과시키는데 그 설정이 작업창을 새로 열어야 적용된다(2026-09-22 실측:
# popcornpc.co.kr 에 CONNECT 403). 서버 VM 은 그 제약이 없다.
#
# 이 워크플로가 «하지 않는» 것 — 이게 안전의 전부다:
#   · sudo 를 쓰지 않는다(popcorn-ci 를 부르지 않는다 → 서버 root 권한과 무관).
#   · DB 에 닿지 않는다(도구의 --from-db 경로를 쓰지 않는다).
#   · 몰에 GET 만 보낸다. 로그인·폼 제출·쿠키가 없다(공개 상세 페이지다).
#   · 결과를 저장소에 커밋하지 않는다 — 산출 JSON 은 실행 산출물로만 남긴다.
#
# ⚠ pull_request 트리거는 절대 넣지 않는다(deploy.yml·regression.yml 의 같은 주석).
name: 몰 완제PC 수집

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '무엇을 하나'
        type: choice
        default: 수집
        options:
          - 수집          # 상세 페이지를 파싱해 JSON 으로 떨군다
          - 목록훑기      # 몰 목록 endpoint 를 훑어 상품번호 전량을 모은다
          - 목록탐색      # 준 주소에서 상품번호·링크 후보를 모은다
          - 구조덤프      # 파싱하지 않고 마크업 구조만 보고한다
          - 원문          # 지정한 줄 범위를 그대로 본다
      codes:
        description: '상품번호 쉼표 구분 (예: 98149,98150) — 수집·구조덤프·원문'
        required: false
        default: ''
      links:
        description: '목록 주소 쉼표 구분 ({page} 쓰면 쪽 수만큼 펼친다)'
        required: false
        default: ''
      pages:
        description: '목록 쪽 수 (목록훑기에서는 최대 쪽 수)'
        required: false
        default: '1'
      limit:
        description: '대상 상한 (0 이면 제한 없음)'
        required: false
        default: '0'
      raw:
        description: '원문 줄 범위 (예: 2000-2015,2310-2560) — 「원문」 모드'
        required: false
        default: ''
      probe:
        description: '목록탐색에서 다른 링크도 함께 보고'
        type: boolean
        default: false

concurrency:
  group: popcorn-mall-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, popcorn-vm]
    # 결과 가지(data/mall-fetch)에 쓰기 위한 것뿐이다. main 에는 쓰지 않는다.
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 파서 자체 검사
        shell: bash
        run: python3 tools/mall_builtpc_fetch.py --selftest

      - name: 수집
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CODES: ${{ inputs.codes }}
          LINKS: ${{ inputs.links }}
          PAGES: ${{ inputs.pages }}
          LIMIT: ${{ inputs.limit }}
          RAW: ${{ inputs.raw }}
          PROBE: ${{ inputs.probe }}
          # 러너 작업공간 안에만 남긴다 — /srv 의 운영 캐시를 건드리지 않는다.
          MALL_BUILTPC_CACHE: ${{ github.workspace }}/.cache/mall_builtpc
        run: |
          set -o pipefail
          mkdir -p out
          args=()
          if [ "$MODE" = "목록훑기" ]; then
            args+=(--plist --max-pages "${PAGES:-50}" --save-dir out --links-only)
          fi
          if [ -n "$LINKS" ]; then
            args+=(--links "$LINKS" --pages "${PAGES:-1}")
            [ "$PROBE" = "true" ] && args+=(--probe)
            [ "$MODE" = "목록탐색" ] && args+=(--links-only)
            [ "$PROBE" = "true" ] && args+=(--save-dir out)
          fi
          if [ -n "$CODES" ]; then args+=(--codes "$CODES"); fi
          if [ "${LIMIT:-0}" != "0" ] && [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          case "$MODE" in
            구조덤프) args+=(--dump) ;;
            원문)     args+=(--raw "$RAW") ;;
            *)        args+=(--out out/mall_builtpc.json) ;;
          esac
          log=$(mktemp)
          python3 tools/mall_builtpc_fetch.py "${args[@]}" 2>&1 | tee "$log"
          {
            echo "## 몰 완제PC 수집 ($MODE)"
            echo '```'
            tail -n 120 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 산출물
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mall-builtpc
          path: out/
          if-no-files-found: ignore
          retention-days: 7

      # 산출물 zip 은 blob 호스트에서 받아야 하는데 클라우드 작업창은 그 호스트에
      # 못 닿는다(2026-09-22 실측: CONNECT 403). github.com 자체는 닿으므로
      # 결과를 «데이터 가지»에 한 커밋으로 올려 둔다 — main 이 아니라서 배포가 돌지
      # 않고(배포는 push: branches [main]), 매번 덮어써 이력이 쌓이지 않는다.
      - name: 결과를 데이터 가지에 올린다
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ls out/* >/dev/null 2>&1 || { echo '올릴 결과가 없습니다 -- 건너뜁니다.'; exit 0; }
          tmp=$(mktemp -d)
          cp out/* "$tmp"/
          cd "$tmp"
          git init -q
          git config user.name 'popcorn-runner'
          git config user.email 'runner@popcornai.local'
          git add -A
          git commit -qm "몰 완제PC 수집 결과 (run $RUN_ID)"
          git push -q --force "https://x-access-token:$TOKEN@github.com/$REPO" HEAD:refs/heads/data/mall-fetch
          echo "데이터 가지 갱신: data/mall-fetch"
