# 고객 여정 끝까지 검수 일회용 (테스트시나리오-v2.md) — 이 브랜치 전용, main 에 병합하지 않는다.
# 개발 서버 공개 고객 화면만 브라우저로 누른다. 비밀값·DB 접속 없음.
name: 고객 여정 끝까지 검수 (일회용)
on:
  push:
    branches: [ci/qa-journey-20261012]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {scen: 'A1,A1@m,A2,A2@m'}
          - {scen: 'A3,A3@m,A4,A4@m'}
          - {scen: 'A5,A5@m,A6,A6@m'}
          - {scen: 'B01,B02,B03,B04'}
          - {scen: 'B04@m,B05,B06,B07'}
          - {scen: 'B08,B09,B10,B11'}
          - {scen: 'B12,B13,B14,B15'}
          - {scen: 'B16,B17,B18,B19'}
          - {scen: 'B20,B21,B22,B22@m'}
          - {scen: 'B23,B24,B25,B26'}
          - {scen: 'B27,B28,B29,B30'}
          - {scen: 'B31,C1,C2,C3'}
          - {scen: 'C4,C5,C6,E01'}
          - {scen: 'E02,E03,E04,E05'}
          - {scen: 'E06,E07a,E07b,E07c'}
          - {scen: 'E08,E09,E10,E11'}
          - {scen: 'E12,E13,E14,E15'}
          - {scen: 'E16,E17,E18,E19'}
          - {scen: 'E20,E21,E22a,E22b'}
          - {scen: 'E22c,E23a,E23b,E23c'}
          - {scen: 'E24a,E24b,E25,E26'}
          - {scen: 'E27,E28,D1,D3'}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qa-journey
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright 설치
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk >/dev/null 2>&1 || true
      - name: 검수
        env:
          SCEN: ${{ matrix.scen }}
          OUT: ${{ runner.temp }}/out
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node qa-journey/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ strategy.job-index }}
          path: ${{ runner.temp }}/out
  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/all
          merge-multiple: true
      - name: 결과를 전용 브랜치에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/all"
          git init -q -b r .
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "qa journey run ${GITHUB_RUN_ID}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push -q -f "https://github.com/${REPO}.git" r:refs/heads/ci/qa-journey-20261012-results
