# 고객 상담 품질 점검(6-2) 일회용 — 이 브랜치 전용, main 에 병합하지 않는다.
# 개발 서버 공개 고객 API 만 부른다. 비밀값·DB 접속·서버 변경 없음.
name: 상담 품질 점검 (일회용)
on:
  push:
    branches: [ci/talk-quality-20261010]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 질문 30개 실행
        env:
          OUT: ${{ runner.temp }}/talk-quality
        run: node run.cjs
      - name: 결과를 전용 브랜치에 올리기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          dir="$RUNNER_TEMP/talk-quality"
          [ -d "$dir" ] && [ -n "$(ls -A "$dir")" ] || { echo '결과 없음'; exit 0; }
          cd "$dir"
          git init -q -b r .
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "talk quality run ${GITHUB_RUN_ID}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push -q -f "https://github.com/${REPO}.git" r:refs/heads/ci/talk-quality-results
