# 팝콘AI 고객 화면(/mvp4)이 보여 주는 상품 정보를 «읽기만» 해서 데이터 가지에 올린다 — 손으로 부르는 전용.
#
# 왜 러너에서 도는가: 클라우드 작업창은 popcornai.co.kr 에 닿지 않는다(403).
# 몰과 팝콘AI 의 상품명·부품 구성·금액 차이를 대조하려고 만들었다(2026-10-21 사장님 요청).
#
# 이 워크플로가 «하지 않는» 것:
#   · sudo·DB 를 쓰지 않는다. 고객 화면과 같은 공개 GET 만 부른다.
#   · main 에 쓰지 않는다 — 결과는 data/ai-products 가지에 덮어쓴다.
#
# ⚠ pull_request 트리거는 절대 넣지 않는다.
name: 팝콘AI 상품 덤프

on:
  workflow_dispatch:
    inputs:
      extra:
        description: '목록에 없어도 몰 등록 구성을 읽어 볼 상품번호 범위 (예: 130569-130679)'
        required: false
        default: ''

concurrency:
  group: popcorn-ai-products-dump
  cancel-in-progress: false

jobs:
  dump:
    runs-on: [self-hosted, popcorn-vm]
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: 고객 목록과 상품별 구성 읽기
        shell: bash
        env:
          BASE: https://popcornai.co.kr
          EXTRA: ${{ inputs.extra }}
        run: |
          set -euo pipefail
          mkdir -p out/offers out/registered
          curl -fsS "$BASE/api/customer/pc-catalog" -o out/pc_catalog.json
          python3 -c "import json;print('\n'.join(str(i['product_code']) for i in json.load(open('out/pc_catalog.json'))['items']))" > out/codes.txt
          echo "목록 $(wc -l < out/codes.txt)건"
          if [ -n "$EXTRA" ]; then
            mkdir -p out/extra
            for range in ${EXTRA//,/ }; do
              for code in $(seq "${range%-*}" "${range#*-}"); do
                curl -sS "$BASE/api/customer/pc-registered/$code" -o "out/extra/$code.json" -w "$code %{http_code}\n" >> out/extra_status.txt || true
                sleep 0.2
              done
            done
            python3 -c "import json,os;json.dump({f[:-5]:json.load(open('out/extra/'+f)) for f in os.listdir('out/extra')},open('out/extra_registered.json','w'),ensure_ascii=False)"
            rm -rf out/extra
          fi
          while read -r code; do
            curl -sS "$BASE/api/customer/pc-offers/$code" -o "out/offers/$code.json" -w "$code %{http_code}\n" >> out/offer_status.txt || echo "$code fail" >> out/offer_status.txt
            curl -sS "$BASE/api/customer/pc-registered/$code" -o "out/registered/$code.json" -w "$code %{http_code}\n" >> out/registered_status.txt || echo "$code fail" >> out/registered_status.txt
            sleep 0.2
          done < out/codes.txt
          python3 - <<'PY'
          import json, os
          for src, dst in (('offers', 'pc_offers'), ('registered', 'pc_registered')):
              d = {}
              for f in os.listdir('out/' + src):
                  try:
                      d[f[:-5]] = json.load(open('out/' + src + '/' + f))
                  except Exception as e:
                      d[f[:-5]] = {'parse_error': str(e)}
              json.dump(d, open('out/' + dst + '.json', 'w'), ensure_ascii=False)
          PY
          rm -rf out/offers out/registered
          cut -d' ' -f2 out/offer_status.txt | sort | uniq -c

      - name: 결과를 데이터 가지에 올린다
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ls out/* >/dev/null 2>&1 || { echo '올릴 결과가 없습니다'; exit 0; }
          tmp=$(mktemp -d)
          cp out/*.json out/*.txt "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          git init -q
          git config user.name 'popcorn-runner'
          git config user.email 'runner@popcornai.local'
          git add -A
          git commit -qm "팝콘AI 상품 덤프 (run $RUN_ID)"
          git push -q --force "https://x-access-token:$TOKEN@github.com/$REPO" HEAD:refs/heads/data/ai-products
