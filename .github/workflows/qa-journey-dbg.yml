# 상세 왕복 결함 추적 일회용 — 이 브랜치 전용, main 에 병합하지 않는다. 공개 고객 화면만 누른다. 비밀값·DB 접속 없음.
name: 고객 여정 왕복 추적 (일회용)
on:
  push:
    branches: [ci/qa-journey-20261012-dbg]
permissions:
  contents: write
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qa-journey
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk >/dev/null 2>&1 || true
      - env:
          OUT: ${{ runner.temp }}/out
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SCEN=B01,B02,B03,B07,B13,B15 node qa-journey/run.cjs
      - name: 결과 올리기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b r .
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "dbg ${GITHUB_RUN_ID}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push -q -f "https://github.com/${REPO}.git" r:refs/heads/ci/qa-journey-20261012-dbg-results
